<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tiêu đề phần mềm cá nhân hóa -->
    <title>Phát triển bởi: Chan Canh Chua (C3)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        select, button { width: 100%; padding: 12px; margin-bottom: 15px; 
                         font-size: 16px; }
        .result-box { padding: 15px; border: 1px solid #ccc; 
                      border-radius: 8px; margin-top: 10px; }
        .btn-menu { color: white; border: none; border-radius: 8px; 
                    font-weight: bold; height: 80px; }
        .btn-back { background-color: #dc3545; color: white; border: none; 
                    border-radius: 8px; width: auto; padding: 10px 20px; }
    </style>
</head>
<body>
    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="homeScreen">
        <h2 style="text-align: center; margin-bottom: 30px;">MENU CHỨC NĂNG</h2>
        <button class="btn-menu" style="background-color: #007bff;" 
            onclick="openTab('dcuTab')">
            Đấu dây tín hiệu DCU và Công tơ
        </button>
        <button class="btn-menu" style="background-color: #28a745;" 
            onclick="alert('Chức năng này đang được phát triển!')">
            Đấu dây tín hiệu Modem và Công tơ
        </button>
    </div>
    <!-- MÀN HÌNH 2: TRA CỨU DCU -->
    <div id="dcuTab" style="display: none;">
        <button class="btn-back" onclick="goHome()">⬅ Quay lại</button>
        <h2>Tra cứu Đấu dây DCU & Công tơ</h2>
        
        <label>Chọn loại DCU:</label>
        <select id="dcuSelect">
            <option value="">-- Đang tải dữ liệu --</option>
        </select>
        
        <label>Chọn loại Công tơ:</label>
        <select id="congToSelect">
            <option value="">-- Đang tải dữ liệu --</option>
        </select>
        
        <div id="result" class="result-box">
            <b>Đang kết nối tải dữ liệu...</b>
        </div>
    </div>

    <script>
        // Thay URL và KEY của Supabase vào đây
        const _supabase = supabase.createClient('https://kezzrlltzddpdtktfqzk.supabase.co', 'sb_publishable_-OA922t0e8G3z3hM0hwguQ_GIAaGmec');
        async function loadData() {
            try {
                const { data: dcuData } = await _supabase.from('Bang DCU').select('*');
                const dcuSelect = document.getElementById('dcuSelect');
                dcuSelect.innerHTML = '<option value="">-- Chọn DCU --</option>';
                if(dcuData) {
                    dcuData.forEach(item => {
                        dcuSelect.innerHTML += 
                          `<option value="${item['Tín Hiệu']}">${item['Loại DCU']}</option>`;
                    });
                }

                const { data: ctData } = await _supabase.from('Bang Cong To').select('*');
                const congToSelect = document.getElementById('congToSelect');
                congToSelect.innerHTML = '<option value="">-- Chọn Công tơ --</option>';
                if(ctData) {
                    ctData.forEach(item => {
                        congToSelect.innerHTML += 
                          `<option value="${item['Tín Hiệu']}">${item['Loại Công Tơ']}</option>`;
                    });
                }
                
                document.getElementById('result').innerHTML = 
                    "<b>Đã tải dữ liệu xong. Sẵn sàng tra cứu!</b>";
            } catch (error) {
                console.log("Lỗi tải dữ liệu", error);
            }
        }

        function showResult() {
            const dcuSig = document.getElementById('dcuSelect').value;
            const ctSig = document.getElementById('congToSelect').value;
            
            let html = '<h3>Kết quả đấu dây:</h3>';
            if(dcuSig) html += `<p><b>Tín Hiệu DCU:</b> ${dcuSig}</p>`;
            if(ctSig) html += `<p><b>Tín Hiệu Công tơ:</b> ${ctSig}</p>`;
            
            document.getElementById('result').innerHTML = html;
        }

        document.getElementById('dcuSelect').addEventListener('change', showResult);
        document.getElementById('congToSelect').addEventListener('change', showResult);

        function openTab(tabId) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById(tabId).style.display = 'block';
        }

        function goHome() {
            document.getElementById('dcuTab').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'block';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
        
        loadData();
    </script>
</body>
</html>
