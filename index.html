<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát triển bởi: Chan Canh Chua (C3)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        select, button { width: 100%; padding: 12px; margin-bottom: 15px; 
                         font-size: 16px; }
        .result-box { padding: 15px; border: 1px solid #ccc; 
                      border-radius: 8px; margin-top: 10px; }
        .btn-menu { color: white; border: none; border-radius: 8px; 
                    font-weight: bold; height: 80px; }
        .btn-back { background-color: #dc3545; color: white; border: none; 
                    border-radius: 8px; width: auto; padding: 10px 20px; }
        .list-item { display: flex; justify-content: space-between; 
                     align-items: center; padding: 10px 0; 
                     border-bottom: 1px solid #eee; }
        .btn-status { width: auto; padding: 8px 12px; font-weight: bold; 
                      border-radius: 5px; border: none; margin-bottom: 0; }
    </style>
</head>
<body>
    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="homeScreen">
        <h2 style="text-align: center; margin-bottom: 5px;">MENU CHỨC NĂNG ĐO XA</h2>
        <p style="text-align: center; margin-top: 0; margin-bottom: 25px; color: gray;">
            <span id="appVersion" style="font-weight: bold; color: #007bff;">Đang tải...</span> <br>
            <span id="syncTime" style="font-size: 14px; color: #28a745;">Đang kiểm tra...</span>
        </p>
        <button class="btn-menu" style="background-color: #007bff;" 
            onclick="openTab('dcuTab')">
            Đấu dây tín hiệu DCU và Công tơ
        </button>
        <button class="btn-menu" style="background-color: #28a745;" 
            onclick="alert('Chức năng này đang được phát triển!')">
            Đấu dây tín hiệu Modem và Công tơ
        </button>
        <button class="btn-menu" style="background-color: #17a2b8;" 
            onclick="alert('Chức năng này đang được phát triển!')">
            Hướng dẫn lắp đặt
        </button>
        <button class="btn-menu" style="background-color: #fd7e14;" 
            onclick="alert('Chức năng này đang được phát triển!')">
            Hướng dẫn khai báo
        </button>
        <button class="btn-menu" style="background-color: #6f42c1;" 
            onclick="alert('Chức năng này đang được phát triển!')">
            Cấu hình và xử lý
        </button>
        <button class="btn-menu" style="background-color: #6c757d;" 
            onclick="openTab('offlineTab'); checkOfflineData();">
            DỮ LIỆU TRÊN MÁY
        </button>
    </div>

    <!-- MÀN HÌNH 2: TRA CỨU DCU -->
    <div id="dcuTab" style="display: none;">
        <button class="btn-back" onclick="goHome()">⬅ Quay lại</button>
        <h2>Tra cứu Đấu dây DCU & Công tơ</h2>
        
        <label>Chọn loại DCU:</label>
        <select id="dcuSelect">
            <option value="">-- Đang tải dữ liệu --</option>
        </select>
        
        <label>Chọn loại Công tơ:</label>
        <select id="congToSelect">
            <option value="">-- Đang tải dữ liệu --</option>
        </select>
        
        <div id="result" class="result-box">
            <b>Đang kết nối tải dữ liệu...</b>
        </div>
    </div>

    <!-- MÀN HÌNH 3: DỮ LIỆU TRÊN MÁY -->
    <div id="offlineTab" style="display: none;">
        <button class="btn-back" onclick="goHome()">⬅ Quay lại</button>
        <h2>Quản lý Dữ Liệu Trên Máy</h2>
        <button class="btn-menu" style="background-color: #17a2b8; height: 45px; 
            margin-bottom: 15px; font-size: 15px;" onclick="updateAllFiles()" id="btnUpdateAll">
            🔄 Cập nhật tất cả
        </button>
        <div id="offlineList" style="border: 1px solid #ccc; border-radius: 8px; padding: 10px;">
            <!-- Danh sách file sẽ được JavaScript tạo ra ở đây -->
        </div>
    </div>
    <!-- Bắt đầu phần mã JavaScript -->
    <script>
        // Thay URL và KEY của Supabase vào đây
        const _supabase = supabase.createClient('https://kezzrlltzddpdtktfqzk.supabase.co', 'sb_publishable_-OA922t0e8G3z3hM0hwguQ_GIAaGmec');
        
        // Cấu hình danh sách các bảng dữ liệu
        const dbFiles = [
            { name: 'Bang DCU', key: 'dcuList' },
            { name: 'Bang Cong To', key: 'ctList' },
            { name: 'Bang MODEM', key: 'modemList' }
        ];
        
        let tempData = {}; 

        async function loadData() {
            if (!localStorage.getItem('dcuList') && navigator.onLine) {
                try {
                    const { data: dcuData } = await _supabase.from('Bang DCU').select('*');
                    const { data: ctData } = await _supabase.from('Bang Cong To').select('*');
                    if (dcuData) localStorage.setItem('dcuList', JSON.stringify(dcuData));
                    if (ctData) localStorage.setItem('ctList', JSON.stringify(ctData));
                    
                    let now = new Date().toLocaleString('vi-VN');
                    localStorage.setItem('dcuList_time', now);
                    localStorage.setItem('ctList_time', now);
                } catch (e) {}
            }

            renderDropdowns();
            
            const saved = localStorage.getItem('dcuList_time') || 'Chưa đồng bộ';
            document.getElementById('syncTime').innerText = "Cập nhật: " + saved;
        }

        function renderDropdowns() {
            const localDcu = JSON.parse(localStorage.getItem('dcuList'));
            const localCt = JSON.parse(localStorage.getItem('ctList'));
            
            const dcuSelect = document.getElementById('dcuSelect');
            dcuSelect.innerHTML = '<option value="">-- Chọn DCU --</option>';
            if (localDcu) {
                localDcu.forEach(item => {
                    dcuSelect.innerHTML += 
                        `<option value="${item['Tín Hiệu']}">${item['Loại DCU']}</option>`;
                });
            }

            const congToSelect = document.getElementById('congToSelect');
            congToSelect.innerHTML = '<option value="">-- Chọn Công tơ --</option>';
            if (localCt) {
                localCt.forEach(item => {
                    congToSelect.innerHTML += 
                        `<option value="${item['Tín Hiệu']}">${item['Loại Công Tơ']}</option>`;
                });
            }
            
            document.getElementById('result').innerHTML = 
                "<b>Đã tải dữ liệu xong. Sẵn sàng tra cứu!</b>";
        }

        async function checkOfflineData() {
            const listDiv = document.getElementById('offlineList');
            let html = '';
            for (let file of dbFiles) {
                let lastSync = localStorage.getItem(file.key + '_time') || 'Chưa tải';
                html += `<div class="list-item">
                            <div>
                                <b>${file.name}</b><br>
                                <span style="font-size: 13px; color: gray;" id="time_${file.key}">
                                    Lần tải: ${lastSync}
                                </span>
                            </div>
                            <div id="btn_${file.key}">
                                <span style="font-size: 13px; color: gray;">Đang kiểm tra...</span>
                            </div>
                         </div>`;
            }
            listDiv.innerHTML = html;

            for (let file of dbFiles) {
                let btnContainer = document.getElementById('btn_' + file.key);
                try {
                    const { data } = await _supabase.from(file.name).select('*');
                    if (data) {
                        tempData[file.key] = data; 
                        const localData = localStorage.getItem(file.key);
                        
                        if (JSON.stringify(data) !== localData) {
                            btnContainer.innerHTML = `<button class="btn-status" 
                                style="background-color: #28a745; color: white;" 
                                onclick="updateFile('${file.key}')">Cần Cập Nhật</button>`;
                        } else {
                            btnContainer.innerHTML = `<button class="btn-status" 
                                style="background-color: #ffc107; color: black;" disabled>
                                Đã Mới Nhất</button>`;
                        }
                    }
                } catch (err) {
                    btnContainer.innerHTML = `<button class="btn-status" 
                        style="background-color: gray; color: white;" disabled>Mất mạng</button>`;
                }
            }
        }

        function updateFile(key) {
            if (tempData[key]) {
                let now = new Date().toLocaleString('vi-VN');
                localStorage.setItem(key, JSON.stringify(tempData[key]));
                localStorage.setItem(key + '_time', now);
                
                document.getElementById('time_' + key).innerText = 'Lần tải: ' + now;
                document.getElementById('btn_' + key).innerHTML = 
                    `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>
                    Đã Mới Nhất</button>`;
                
                renderDropdowns(); 
                if (key === 'dcuList') {
                    document.getElementById('syncTime').innerText = "Cập nhật: " + now;
                }
            }
        }

        async function updateAllFiles() {
            const btnAll = document.getElementById('btnUpdateAll');
            btnAll.innerText = "Đang cập nhật...";
            btnAll.disabled = true;

            for (let file of dbFiles) {
                if (!tempData[file.key]) {
                    try {
                        const { data } = await _supabase.from(file.name).select('*');
                        if (data) tempData[file.key] = data;
                    } catch (e) {}
                }
                
                if (tempData[file.key]) {
                    let now = new Date().toLocaleString('vi-VN');
                    localStorage.setItem(file.key, JSON.stringify(tempData[file.key]));
                    localStorage.setItem(file.key + '_time', now);
                    
                    document.getElementById('time_' + file.key).innerText = 'Lần tải: ' + now;
                    document.getElementById('btn_' + file.key).innerHTML = 
                        `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>
                        Đã Mới Nhất</button>`;
                }
            }
            
            renderDropdowns();
            let dcuSync = localStorage.getItem('dcuList_time');
            if (dcuSync) document.getElementById('syncTime').innerText = "Cập nhật: " + dcuSync;
            
            btnAll.innerText = "🔄 Cập nhật tất cả";
            btnAll.disabled = false;
        }

        async function getVersion() {
            try {
                const response = await fetch('./sw.js');
                const text = await response.text();
                const match = text.match(/const CACHE_NAME = '([^']+)'/);
                if (match && match[1]) {
                    document.getElementById('appVersion').innerText = match[1];
                }
            } catch (err) {
                console.log("Lỗi đọc version từ sw.js");
            }
        }

        function showResult() {
            const dcuSig = document.getElementById('dcuSelect').value;
            const ctSig = document.getElementById('congToSelect').value;
            
            let html = '<h3>Kết quả đấu dây:</h3>';
            if(dcuSig) html += `<p><b>Tín Hiệu DCU:</b> ${dcuSig}</p>`;
            if(ctSig) html += `<p><b>Tín Hiệu Công tơ:</b> ${ctSig}</p>`;
            
            document.getElementById('result').innerHTML = html;
        }

        document.getElementById('dcuSelect').addEventListener('change', showResult);
        document.getElementById('congToSelect').addEventListener('change', showResult);

        function openTab(tabId) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('dcuTab').style.display = 'none';
            document.getElementById('offlineTab').style.display = 'none';
            
            document.getElementById(tabId).style.display = 'block';
        }

        function goHome() {
            document.getElementById('dcuTab').style.display = 'none';
            document.getElementById('offlineTab').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'block';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
            
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
        
        loadData();
        getVersion();
    </script>
</body>
</html>
