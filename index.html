<body>
    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="homeScreen">
        <h2 style="text-align: center; margin-bottom: 30px;">MENU CHỨC NĂNG</h2>
        <button onclick="openTab('dcuTab')" style="background-color: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; height: 80px;">
            Đấu dây tín hiệu DCU và Công tơ
        </button>
        <button onclick="alert('Chức năng này đang được phát triển!')" style="background-color: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; height: 80px;">
            Đấu dây tín hiệu Modem và Công tơ
        </button>
    </div>

    <!-- MÀN HÌNH 2: TRA CỨU DCU -->
    <div id="dcuTab" style="display: none;">
        <button onclick="goHome()" style="background-color: #dc3545; color: white; border: none; border-radius: 8px; width: auto; padding: 10px 20px;">
            ⬅ Quay lại
        </button>
        <h2>Tra cứu Đấu dây DCU & Công tơ</h2>
        
        <label>Chọn loại DCU:</label>
        <select id="dcuSelect"><option value="">-- Chọn DCU --</option></select>
        
        <label>Chọn loại Công tơ:</label>
        <select id="congToSelect"><option value="">-- Chọn Công tơ --</option></select>
        
        <div id="result" class="result-box">
            <b>Đã tải dữ liệu xong. Sẵn sàng tra cứu!</b>
        </div>
    </div>

    <script>
        // ... (Giữ nguyên đoạn script kết nối Supabase và loadData() của bạn ở đây) ...

        // HÀM CHUYỂN ĐỔI MÀN HÌNH
        function openTab(tabId) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById(tabId).style.display = 'block';
        }

        function goHome() {
            document.getElementById('dcuTab').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'block';
        }
    </script>
</body>
