<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát triển bởi: Chan Canh Chua (C3)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        select, button { width: 100%; padding: 12px; margin-bottom: 15px; 
                         font-size: 16px; }
        .result-box { padding: 15px; border: 1px solid #ccc; 
                      border-radius: 8px; margin-top: 10px; }
        .btn-menu { color: white; border: none; border-radius: 8px; 
                    font-weight: bold; height: 80px; }
        .btn-back { background-color: #dc3545; color: white; border: none; 
                    border-radius: 8px; width: auto; padding: 10px 20px; }
        .list-item { display: flex; justify-content: space-between; 
                     align-items: center; padding: 10px 0; 
                     border-bottom: 1px solid #eee; }
        .btn-status { width: auto; padding: 8px 12px; font-weight: bold; 
                      border-radius: 5px; border: none; margin-bottom: 0; }
    </style>
</head>
<body>
    <!-- MÀN HÌNH 1: TRANG CHỦ -->
    <div id="homeScreen">
        <h2 style="text-align: center; margin-bottom: 5px;">MENU CHỨC NĂNG ĐO XA</h2>
        <p style="text-align: center; margin-top: 0; margin-bottom: 25px; color: gray;">
            <span id="appVersion" style="font-weight: bold; color: #007bff;">Đang tải...</span> <br>
            <span id="syncTime" style="font-size: 14px; color: #28a745;">Đang kiểm tra...</span>
        </p>
        <button class="btn-menu" style="background-color: #007bff;" onclick="openTab('dcuTab')">
            Đấu dây tín hiệu DCU và Công tơ
        </button>
        <button class="btn-menu" style="background-color: #28a745;" onclick="openTab('modemTab')">
            Đấu dây tín hiệu Modem và Công tơ
        </button>
        <button class="btn-menu" style="background-color: #17a2b8;" onclick="alert('Chức năng đang phát triển!')">
            Hướng dẫn lắp đặt
        </button>
        <button class="btn-menu" style="background-color: #fd7e14;" onclick="alert('Chức năng đang phát triển!')">
            Hướng dẫn khai báo
        </button>
        <button class="btn-menu" style="background-color: #6f42c1;" onclick="alert('Chức năng đang phát triển!')">
            Cấu hình và xử lý
        </button>
        <button class="btn-menu" style="background-color: #6c757d;" onclick="openTab('offlineTab'); checkOfflineData();">
            DỮ LIỆU TRÊN MÁY
        </button>
    </div>

    <!-- MÀN HÌNH 2: TRA CỨU DCU -->
    <div id="dcuTab" style="display: none;">
        <button class="btn-back" onclick="goHome()">⬅ Quay lại</button>
        <h2>Tra cứu Đấu dây DCU & Công tơ</h2>
        <label>Chọn loại DCU:</label>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="dcuSelect" style="margin-bottom: 0;"><option value="">-- Đang tải --</option></select>
            <button class="btn-menu" style="width: 60px; height: auto; margin-bottom: 0; padding: 10px;" onclick="viewImage('DCU', 'dcuSelect')">🖼️</button>
        </div>
        <label>Chọn loại Công tơ:</label>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="congToSelect" style="margin-bottom: 0;"><option value="">-- Đang tải --</option></select>
            <button class="btn-menu" style="width: 60px; height: auto; margin-bottom: 0; padding: 10px;" onclick="viewImage('CONGTO', 'congToSelect')">🖼️</button>
        </div>
        <div id="result" class="result-box"><b>Đang kết nối tải dữ liệu...</b></div>
    </div>

    <!-- MÀN HÌNH 2B: TRA CỨU MODEM -->
    <div id="modemTab" style="display: none;">
        <button class="btn-back" onclick="goHome()">⬅ Quay lại</button>
        <h2>Tra cứu Đấu dây Modem & Công tơ</h2>
        <label>Chọn loại Modem:</label>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="modemSelect" style="margin-bottom: 0;"><option value="">-- Đang tải --</option></select>
            <button class="btn-menu" style="width: 60px; height: auto; margin-bottom: 0; padding: 10px;" onclick="viewImage('MODEM', 'modemSelect')">🖼️</button>
        </div>
        <label>Chọn loại Công tơ:</label>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="congToModemSelect" style="margin-bottom: 0;"><option value="">-- Đang tải --</option></select>
            <button class="btn-menu" style="width: 60px; height: auto; margin-bottom: 0; padding: 10px;" onclick="viewImage('CONGTO', 'congToModemSelect')">🖼️</button>
        </div>
        <div id="resultModem" class="result-box"><b>Đang kết nối tải dữ liệu...</b></div>
    </div>

    <!-- MÀN HÌNH 3: DỮ LIỆU TRÊN MÁY -->
    <div id="offlineTab" style="display: none;">
        <button class="btn-back" onclick="goHome()">⬅ Quay lại</button>
        <h2>Quản lý Dữ Liệu Trên Máy</h2>
        <button class="btn-menu" style="background-color: #17a2b8; height: 45px; margin-bottom: 15px; font-size: 15px;" onclick="updateAllFiles()" id="btnUpdateAll">
            🔄 Cập nhật tất cả
        </button>
        <div id="offlineList" style="border: 1px solid #ccc; border-radius: 8px; padding: 10px;"></div>
    </div>

    <!-- MÀN HÌNH XEM ẢNH -->
    <div id="imageModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;" onclick="closeImage()">
        <button type="button" onclick="closeImage(); event.stopPropagation();" style="background: #dc3545; color: white; border: none; padding: 10px 30px; border-radius: 8px; margin-bottom: 15px; width: auto; font-weight: bold;">
            ❌ Đóng ảnh
        </button>
        <img id="modalImg" src="" style="max-width: 95%; max-height: 80%; border-radius: 8px; background: white;" alt="Đang tải ảnh..." onclick="event.stopPropagation();" onerror="this.onerror=null; this.alt='Không có ảnh!';">
    </div>

    <!-- Bắt đầu phần mã JavaScript -->
    <script>
        const _supabase = supabase.createClient('https://kezzrlltzddpdtktfqzk.supabase.co', 'sb_publishable_-OA922t0e8G3z3hM0hwguQ_GIAaGmec');
        let currentCacheName = 'do-xa-v1.09'; 

        // Cấu hình danh sách (đã thêm dạng 'image')
        const dbFiles = [
            { name: 'Bang DCU', key: 'dcuList', type: 'db' },
            { name: 'Bang Cong To', key: 'ctList', type: 'db' },
            { name: 'Bang MODEM', key: 'modemList', type: 'db' },
            { name: 'Hình Ảnh Thiết Bị', key: 'imageList', type: 'image' }
        ];
        
        let tempData = {}; 

        function viewImage(prefix, selectId) {
            const sel = document.getElementById(selectId);
            if (sel.selectedIndex <= 0) {
                alert("Vui lòng chọn thiết bị trước khi xem ảnh!");
                return;
            }
            const deviceName = sel.options[sel.selectedIndex].text;
            const fileName = `${prefix}_${deviceName}.png`; 
            const baseUrl = 'https://kezzrlltzddpdtktfqzk.supabase.co/storage/v1/object/public/images';
            document.getElementById('modalImg').src = `${baseUrl}/${fileName}`;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeImage() {
            document.getElementById('imageModal').style.display = 'none';
        }

        function getExpectedImageUrls() {
            const urls = new Set();
            const baseUrl = 'https://kezzrlltzddpdtktfqzk.supabase.co/storage/v1/object/public/images';
            const dcus = JSON.parse(localStorage.getItem('dcuList')) || [];
            const cts = JSON.parse(localStorage.getItem('ctList')) || [];
            const modems = JSON.parse(localStorage.getItem('modemList')) || [];

            dcus.forEach(d => { if(d['Loại DCU']) urls.add(`${baseUrl}/DCU_${d['Loại DCU']}.png`); });
            cts.forEach(c => { if(c['Loại Công Tơ']) urls.add(`${baseUrl}/CONGTO_${c['Loại Công Tơ']}.png`); });
            modems.forEach(m => { if(m['Loại MODEM']) urls.add(`${baseUrl}/MODEM_${m['Loại MODEM']}.png`); });
            return Array.from(urls);
        }

        async function loadData() {
            if (!localStorage.getItem('dcuList') && navigator.onLine) {
                try {
                    const { data: dcuData } = await _supabase.from('Bang DCU').select('*');
                    const { data: ctData } = await _supabase.from('Bang Cong To').select('*');
                    const { data: modemData } = await _supabase.from('Bang MODEM').select('*');
                    
                    if (dcuData) localStorage.setItem('dcuList', JSON.stringify(dcuData));
                    if (ctData) localStorage.setItem('ctList', JSON.stringify(ctData));
                    if (modemData) localStorage.setItem('modemList', JSON.stringify(modemData));
                    
                    let now = new Date().toLocaleString('vi-VN');
                    localStorage.setItem('dcuList_time', now);
                    localStorage.setItem('ctList_time', now);
                    localStorage.setItem('modemList_time', now);
                } catch (e) {}
            }
            renderDropdowns();
            const saved = localStorage.getItem('dcuList_time') || 'Chưa đồng bộ';
            document.getElementById('syncTime').innerText = "Cập nhật: " + saved;
        }

        function renderDropdowns() {
            const localDcu = JSON.parse(localStorage.getItem('dcuList'));
            const localCt = JSON.parse(localStorage.getItem('ctList'));
            const localModem = JSON.parse(localStorage.getItem('modemList'));
            
            const dcuSelect = document.getElementById('dcuSelect');
            dcuSelect.innerHTML = '<option value="">-- Chọn DCU --</option>';
            if (localDcu) localDcu.forEach(item => dcuSelect.innerHTML += `<option value="${item['Tín Hiệu']}">${item['Loại DCU']}</option>`);

            const congToSelect = document.getElementById('congToSelect');
            congToSelect.innerHTML = '<option value="">-- Chọn Công tơ --</option>';
            if (localCt) localCt.forEach(item => congToSelect.innerHTML += `<option value="${item['Tín Hiệu']}">${item['Loại Công Tơ']}</option>`);
            
            const modemSelect = document.getElementById('modemSelect');
            modemSelect.innerHTML = '<option value="">-- Chọn Modem --</option>';
            if (localModem) localModem.forEach(item => modemSelect.innerHTML += `<option value="${item['Tín Hiệu']}">${item['Loại MODEM']}</option>`);

            const congToModemSelect = document.getElementById('congToModemSelect');
            congToModemSelect.innerHTML = '<option value="">-- Chọn Công tơ --</option>';
            if (localCt) localCt.forEach(item => congToModemSelect.innerHTML += `<option value="${item['Tín Hiệu']}">${item['Loại Công Tơ']}</option>`);
            
            document.getElementById('result').innerHTML = "<b>Đã tải dữ liệu xong. Sẵn sàng tra cứu!</b>";
            document.getElementById('resultModem').innerHTML = "<b>Đã tải dữ liệu xong. Sẵn sàng tra cứu!</b>";
        }

        function showModemResult() {
            const modemSig = document.getElementById('modemSelect').value;
            const ctSig = document.getElementById('congToModemSelect').value;
            let html = '<h3>Kết quả đấu dây:</h3>';
            if(modemSig) html += `<p><b>Tín Hiệu Modem:</b> ${modemSig}</p>`;
            if(ctSig) html += `<p><b>Tín Hiệu Công tơ:</b> ${ctSig}</p>`;
            document.getElementById('resultModem').innerHTML = html;
        }

        function showResult() {
            const dcuSig = document.getElementById('dcuSelect').value;
            const ctSig = document.getElementById('congToSelect').value;
            let html = '<h3>Kết quả đấu dây:</h3>';
            if(dcuSig) html += `<p><b>Tín Hiệu DCU:</b> ${dcuSig}</p>`;
            if(ctSig) html += `<p><b>Tín Hiệu Công tơ:</b> ${ctSig}</p>`;
            document.getElementById('result').innerHTML = html;
        }

        document.getElementById('modemSelect').addEventListener('change', showModemResult);
        document.getElementById('congToModemSelect').addEventListener('change', showModemResult);
        document.getElementById('dcuSelect').addEventListener('change', showResult);
        document.getElementById('congToSelect').addEventListener('change', showResult);

        async function updateImages() {
            const btnContainer = document.getElementById('btn_imageList');
            btnContainer.innerHTML = `<button class="btn-status" style="background-color: gray; color: white;" disabled>Đang tải...</button>`;
            try {
                const urls = getExpectedImageUrls();
                const cache = await caches.open(currentCacheName);
                await Promise.all(urls.map(async url => {
                    try {
                        const match = await cache.match(url);
                        if (!match) {
                            const response = await fetch(url);
                            if (response.ok) await cache.put(url, response);
                        }
                    } catch(e) {}
                }));
                let now = new Date().toLocaleString('vi-VN');
                localStorage.setItem('imageList_time', now);
                document.getElementById('time_imageList').innerText = 'Lần tải: ' + now;
                btnContainer.innerHTML = `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>Đã Mới Nhất</button>`;
            } catch(e) {
                btnContainer.innerHTML = `<button class="btn-status" style="background-color: #dc3545; color: white;" onclick="updateImages()">Lỗi tải</button>`;
            }
        }

        async function checkOfflineData() {
            const listDiv = document.getElementById('offlineList');
            let html = '';
            for (let file of dbFiles) {
                let lastSync = localStorage.getItem(file.key + '_time') || 'Chưa tải';
                html += `<div class="list-item">
                            <div><b>${file.name}</b><br>
                            <span style="font-size: 13px; color: gray;" id="time_${file.key}">Lần tải: ${lastSync}</span></div>
                            <div id="btn_${file.key}"><span style="font-size: 13px; color: gray;">Đang kiểm tra...</span></div>
                         </div>`;
            }
            listDiv.innerHTML = html;

            for (let file of dbFiles) {
                let btnContainer = document.getElementById('btn_' + file.key);
                if (file.type === 'db') {
                    try {
                        const { data } = await _supabase.from(file.name).select('*');
                        if (data) {
                            tempData[file.key] = data; 
                            const localData = localStorage.getItem(file.key);
                            if (JSON.stringify(data) !== localData) {
                                btnContainer.innerHTML = `<button class="btn-status" style="background-color: #28a745; color: white;" onclick="updateFile('${file.key}')">Cần Cập Nhật</button>`;
                            } else {
                                btnContainer.innerHTML = `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>Đã Mới Nhất</button>`;
                            }
                        }
                    } catch (err) {
                        btnContainer.innerHTML = `<button class="btn-status" style="background-color: gray; color: white;" disabled>Mất mạng</button>`;
                    }
                } else if (file.type === 'image') {
                    try {
                        const urls = getExpectedImageUrls();
                        if (urls.length === 0) {
                            btnContainer.innerHTML = `<button class="btn-status" style="background-color: gray; color: white;" disabled>Trống</button>`;
                            continue;
                        }
                        const cache = await caches.open(currentCacheName);
                        let needsUpdate = false;
                        for (let url of urls) {
                            const match = await cache.match(url);
                            if (!match) { needsUpdate = true; break; }
                        }
                        if (needsUpdate) {
                            btnContainer.innerHTML = `<button class="btn-status" style="background-color: #28a745; color: white;" onclick="updateImages()">Cần Cập Nhật</button>`;
                        } else {
                            btnContainer.innerHTML = `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>Đã Mới Nhất</button>`;
                        }
                    } catch (err) {
                        btnContainer.innerHTML = `<button class="btn-status" style="background-color: gray; color: white;" disabled>Lỗi</button>`;
                    }
                }
            }
        }

        function updateFile(key) {
            if (tempData[key]) {
                let now = new Date().toLocaleString('vi-VN');
                localStorage.setItem(key, JSON.stringify(tempData[key]));
                localStorage.setItem(key + '_time', now);
                document.getElementById('time_' + key).innerText = 'Lần tải: ' + now;
                document.getElementById('btn_' + key).innerHTML = `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>Đã Mới Nhất</button>`;
                renderDropdowns(); 
                if (key === 'dcuList') document.getElementById('syncTime').innerText = "Cập nhật: " + now;
            }
        }

        async function updateAllFiles() {
            const btnAll = document.getElementById('btnUpdateAll');
            btnAll.innerText = "Đang cập nhật...";
            btnAll.disabled = true;

            for (let file of dbFiles) {
                if (file.type === 'db') {
                    if (!tempData[file.key]) {
                        try {
                            const { data } = await _supabase.from(file.name).select('*');
                            if (data) tempData[file.key] = data;
                        } catch (e) {}
                    }
                    if (tempData[file.key]) {
                        let now = new Date().toLocaleString('vi-VN');
                        localStorage.setItem(file.key, JSON.stringify(tempData[file.key]));
                        localStorage.setItem(file.key + '_time', now);
                        document.getElementById('time_' + file.key).innerText = 'Lần tải: ' + now;
                        document.getElementById('btn_' + file.key).innerHTML = `<button class="btn-status" style="background-color: #ffc107; color: black;" disabled>Đã Mới Nhất</button>`;
                    }
                } else if (file.type === 'image') {
                    await updateImages();
                }
            }
            renderDropdowns();
            let dcuSync = localStorage.getItem('dcuList_time');
            if (dcuSync) document.getElementById('syncTime').innerText = "Cập nhật: " + dcuSync;
            btnAll.innerText = "🔄 Cập nhật tất cả";
            btnAll.disabled = false;
        }

        async function getVersion() {
            try {
                const response = await fetch('./sw.js');
                const text = await response.text();
                const match = text.match(/const CACHE_NAME = '([^']+)'/);
                if (match && match[1]) {
                    currentCacheName = match[1];
                    document.getElementById('appVersion').innerText = currentCacheName;
                }
            } catch (err) {}
        }

        function openTab(tabId) {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('dcuTab').style.display = 'none';
            document.getElementById('modemTab').style.display = 'none';
            document.getElementById('offlineTab').style.display = 'none';
            document.getElementById(tabId).style.display = 'block';
        }

        function goHome() {
            document.getElementById('dcuTab').style.display = 'none';
            document.getElementById('modemTab').style.display = 'none';
            document.getElementById('offlineTab').style.display = 'none';
            document.getElementById('homeScreen').style.display = 'block';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) { refreshing = true; window.location.reload(); }
            });
        }
        
        loadData();
        getVersion();
    </script>
</body>
</html>
